    <title>Bracket Tournament Manager</title>
    <!-- GitHub Pages SPA routing: 404.html redirige con ?p=/ruta
         Este script restaura la ruta real antes de que React cargue. -->
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            decoded.shift() + (decoded.length ? '?' + decoded.join('&') : '') + l.hash
          );
        }
      }(window.location));
    </script>
