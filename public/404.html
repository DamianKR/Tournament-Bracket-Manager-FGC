<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Bracket Tournament Manager</title>
    <!-- GitHub Pages SPA routing
         Cuando GitHub Pages no encuentra un archivo para una ruta
         (ej: /events), sirve este 404.html.
         El script redirige al index con la ruta real como parámetro ?p=
         para que React Router pueda manejarla correctamente. -->
    <script>
      var l = window.location;
      // GitHub Pages SPA redirect: https://github.com/rafgraph/spa-github-pages
      // Detectar cuántos segmentos tiene la base path del repo (1 para /repo-name/)
      var pathSegmentsToKeep = 1;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
