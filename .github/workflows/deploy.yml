name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # permite lanzarlo manualmente desde GitHub

permissions:
  contents: write      # necesario para escribir la rama gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # URL del backend en Render — configúrala en GitHub:
          # Settings → Secrets and variables → Actions → Variables → VITE_API_URL
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # GITHUB_REPOSITORY está disponible automáticamente en Actions.
          # vite.config.ts lo lee para construir la base path correcta.
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Evita que Jekyll ignore carpetas que empiezan con _
          enable_jekyll: false
